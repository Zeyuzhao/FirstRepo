<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        #gameCanvas {
            border: 3px solid #333;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 100%);
            display: block;
            margin: 20px auto;
            cursor: pointer;
            border-radius: 5px;
        }

        .info {
            margin-top: 20px;
            font-size: 18px;
            color: #555;
        }

        .score {
            font-weight: bold;
            color: #667eea;
            font-size: 24px;
        }

        .controls {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
            line-height: 1.8;
        }

        .status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 30px;
        }

        .game-over {
            color: #e74c3c;
        }

        .playing {
            color: #27ae60;
        }

        button {
            margin-top: 15px;
            padding: 10px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐦 Flappy Bird</h1>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="info">
            Score: <span class="score" id="score">0</span>
        </div>
        
        <div class="controls">
            <p>Click or Press SPACE to make the bird fly!</p>
        </div>
        
        <div class="status" id="status">
            <span class="playing">Ready to play! Click to start.</span>
        </div>
        
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const scoreSpan = document.getElementById('score');

        // Game variables
        let bird = {
            x: 50,
            y: 250,
            width: 34,
            height: 24,
            velocity: 0,
            gravity: 0.5,
            jumpPower: -12
        };

        let pipes = [];
        let score = 0;
        let gameRunning = true;
        let gameStarted = false;
        const pipeGap = 130;
        const pipeWidth = 52;
        const pipeSeparation = 200;

        // Colors
        const birdColor = '#FFD700';
        const pipeColor = '#2ecc71';
        const skyColor = '#87CEEB';
        const groundColor = '#8B7355';

        // Draw bird
        function drawBird() {
            ctx.fillStyle = birdColor;
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(bird.x, bird.y, bird.width, bird.height);
            
            // Draw eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(bird.x + 25, bird.y + 8, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw pipes
        function drawPipes() {
            ctx.fillStyle = pipeColor;
            for (let pipe of pipes) {
                // Top pipe
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                // Bottom pipe
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height - pipe.topHeight - pipeGap);
                
                // Add borders
                ctx.strokeStyle = '#27ae60';
                ctx.lineWidth = 2;
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                ctx.strokeRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height - pipe.topHeight - pipeGap);
            }
        }

        // Generate random pipe
        function generatePipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - 50;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            return {
                x: canvas.width,
                topHeight: topHeight,
                scored: false
            };
        }

        // Update game
        function update() {
            if (!gameRunning) return;

            if (gameStarted) {
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                // Generate pipes
                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - pipeSeparation) {
                    pipes.push(generatePipe());
                }

                // Move pipes
                pipes = pipes.filter(pipe => {
                    pipe.x -= 5;
                    
                    // Update score
                    if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
                        pipe.scored = true;
                        score++;
                        scoreSpan.textContent = score;
                    }
                    
                    return pipe.x + pipeWidth > 0;
                });

                // Collision detection
                for (let pipe of pipes) {
                    // Check if bird hits pipe
                    if (bird.x < pipe.x + pipeWidth && bird.x + bird.width > pipe.x) {
                        if (bird.y < pipe.topHeight || bird.y + bird.height > pipe.topHeight + pipeGap) {
                            endGame();
                            return;
                        }
                    }
                }

                // Check if bird hits ground or ceiling
                if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
                    endGame();
                    return;
                }
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas with gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, skyColor);
            gradient.addColorStop(1, '#e0f6ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawPipes();
            drawBird();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // End game
        function endGame() {
            gameRunning = false;
            statusDiv.innerHTML = '<span class="game-over">Game Over! Final Score: ' + score + '</span>';
        }

        // Reset game
        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            gameRunning = true;
            gameStarted = false;
            scoreSpan.textContent = '0';
            statusDiv.innerHTML = '<span class="playing">Ready to play! Click to start.</span>';
        }

        // Handle input
        function handleJump() {
            if (!gameStarted) {
                gameStarted = true;
                statusDiv.innerHTML = '<span class="playing">Playing...</span>';
            }
            if (gameRunning) {
                bird.velocity = bird.jumpPower;
            }
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleJump();
            }
        });

        canvas.addEventListener('click', handleJump);

        // Start game loop
        gameLoop();
    </script>
</body>
</html>
